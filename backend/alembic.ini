# Alembic configuration for AbleNova backend

[alembic]
script_location = alembic
prepend_sys_path = .
version_locations = %(here)s/alembic/versions

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a corresponding .py file
sourceless = false

# Database connection URL (can be overridden in env.py via core.config)
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/ablenova

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
